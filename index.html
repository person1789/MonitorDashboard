<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1">
    <title>Command Center — Ajay</title>
    <meta name="description" content="Personal college life dashboard for OSU ECE student">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/layout-mode.css">
    <link rel="stylesheet" href="css/standby.css">
</head>
<body>
    <!-- Animated gradient background -->
    <div class="bg-gradient" aria-hidden="true">
        <div class="bg-orb bg-orb--blue"></div>
        <div class="bg-orb bg-orb--purple"></div>
        <div class="bg-orb bg-orb--teal"></div>
    </div>

    <!-- ===== Welcome Screen ===== -->
    <div id="welcome-screen" class="welcome-overlay">
        <div class="welcome-card">
            <h1 class="welcome-greeting" id="welcome-greeting"></h1>
            <p class="welcome-date" id="welcome-date"></p>
            <div class="welcome-day-badge" id="welcome-day-badge"></div>
            <p class="welcome-quote" id="welcome-quote"></p>
            <div class="welcome-cta">
                <span>Click anywhere to enter</span>
                <div class="welcome-cta-ring"></div>
            </div>
        </div>
    </div>

    <!-- ===== Dashboard ===== -->
    <main id="dashboard" class="dashboard" style="display:none;">
        <div id="module-canvas" class="module-canvas"></div>

        <!-- Focus mode FAB -->
        <button id="btn-focus" class="fab-focus" title="Start Focus Session" aria-label="Toggle focus study mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
            </svg>
        </button>

        <!-- Focus session popover -->
        <div id="focus-popover" class="focus-popover">
            <h3>Start Focus Session</h3>
            <div class="focus-field">
                <label class="focus-label">Subject</label>
                <select class="focus-select" id="focus-subject">
                    <option value="Physics">Physics</option>
                    <option value="Math">Math</option>
                    <option value="ECE">ECE</option>
                    <option value="Latin">Latin</option>
                    <option value="Coding">Coding</option>
                    <option value="General">General</option>
                </select>
            </div>
            <div class="focus-field">
                <label class="focus-label">Task (optional)</label>
                <input class="focus-input" id="focus-task" type="text" placeholder="e.g. Chapter 7 Problems">
            </div>
            <div class="focus-field">
                <label class="focus-label">Duration</label>
                <div class="focus-durations">
                    <button class="focus-dur-btn" data-min="15">15m</button>
                    <button class="focus-dur-btn selected" data-min="25">25m</button>
                    <button class="focus-dur-btn" data-min="45">45m</button>
                    <button class="focus-dur-btn" data-min="60">60m</button>
                </div>
            </div>
            <button class="focus-start-btn" id="focus-start">Start Session →</button>
        </div>

        <!-- Layout mode toggle FAB -->
        <button id="btn-layout-mode" class="fab-layout" title="Edit Layout" aria-label="Toggle layout editing mode">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
        </button>
    </main>

    <!-- ===== Layout Mode Overlay ===== -->
    <div id="layout-overlay" class="layout-overlay" style="display:none;">
        <div class="layout-grid" id="layout-grid"></div>
        <div class="layout-toolbar">
            <div class="layout-toolbar-group">
                <button class="layout-btn" id="btn-add-module">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Module
                </button>
                <div style="display:flex;align-items:center;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);">
                    <select class="layout-btn" id="btn-preset-layout" style="cursor:pointer;font-family:var(--font-sans);border:none;background:transparent;">
                        <option value="">⚡ Presets</option>
                    </select>
                    <button class="layout-btn" id="btn-save-preset" style="border:none;border-left:0.5px solid var(--color-border-secondary);background:transparent;" title="Save current layout as a custom preset">+</button>
                </div>
                <button class="layout-btn" id="btn-reset-layout">Reset</button>
            </div>
            <div class="layout-toolbar-group">
                <button class="layout-btn layout-btn--cancel" id="btn-cancel-layout">Cancel</button>
                <button class="layout-btn layout-btn--save" id="btn-save-layout">Save Layout</button>
            </div>
        </div>
    </div>

    <!-- ===== Module Tray ===== -->
    <div id="module-tray" class="module-tray" style="display:none;">
        <div class="module-tray-header">
            <h2>Available Modules</h2>
            <button class="module-tray-close" id="btn-close-tray">&times;</button>
        </div>
        <div class="module-tray-grid" id="module-tray-grid"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script type="module" src="js/app.js"></script>
</body>
</html>
